services:
  api:
    volumes:
      - ./api:/var/www/html

  frontend:
    build: !reset null
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm start -- --host 0.0.0.0 --poll 2000"
    environment:
      CHOKIDAR_USEPOLLING: "true"

  gateway:
    volumes:
      - ./docker/nginx/gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  frontend_node_modules:
