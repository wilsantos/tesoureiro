<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extrato de conta – PicPay – Março 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 11px;
      color: #222;
      background: #e8e8e8;
    }

    /* ── Page shell ── */
    .page {
      width: 595px;
      background: #fff;
      margin: 24px auto;
      padding: 28px 28px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }

    /* ── Top header ── */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .account-info {
      font-size: 10px;
      color: #444;
      line-height: 1.55;
    }

    .account-info .name {
      color: #222;
      font-weight: 600;
      font-size: 10.5px;
    }


    /* ── Extrato title block ── */
    .extrato-title-block {
      margin-bottom: 16px;
    }

    .extrato-label {
      font-size: 14px;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }

    .period-row {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .period-label, .saldo-label {
      font-size: 9.5px;
      color: #222;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 2px;
    }

    .period-value {
      font-size: 15px;
      font-weight: 700;
      color: #222;
    }

    .saldo-value {
      font-size: 15px;
      font-weight: 700;
      color: #21c25e;
    }

    /* ── Date section ── */
    .date-section {
      margin-bottom: 10px;
    }

    .date-header {
      background: #f2f2f2;
      border-radius: 6px 6px 0 0;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-header .date-text {
      font-size: 9.5px;
      color: #555;
      font-weight: 600;
    }

    .date-header .saldo-text {
      font-size: 9.5px;
      color: #555;
    }

    /* ── Transaction table ── */
    .tx-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #ebebeb;
      border-top: none;
    }

    .tx-table thead tr {
      background: #fafafa;
      border-bottom: 1px solid #e8e8e8;
    }

    .tx-table thead th {
      padding: 5px 8px;
      text-align: left;
      font-size: 9px;
      font-weight: 700;
      color: #222;
      text-transform: none;
    }

    .tx-table thead th.col-valor {
      text-align: right;
    }

    .tx-table tbody tr {
      border-bottom: 1px solid #f0f0f0;
    }

    .tx-table tbody tr:last-child {
      border-bottom: none;
    }

    .tx-table tbody td {
      padding: 7px 8px;
      font-size: 10px;
      color: #222;
      vertical-align: middle;
    }

    .tx-table tbody td.col-hora {
      white-space: nowrap;
      color: #555;
      width: 44px;
    }

    .tx-table tbody td.col-tipo {
      color: #222;
      font-weight: 600;
      width: 88px;
    }

    .tx-table tbody td.col-origem {
      color: #333;
      width: 130px;
    }

    .tx-table tbody td.col-forma {
      color: #555;
      width: 110px;
    }

    .tx-table tbody td.col-valor {
      text-align: right;
      white-space: nowrap;
      font-weight: 700;
    }

    .valor-credito { color: #21c25e; }
    .valor-debito  { color: #444; }

    /* ── Footer ── */
    .page-footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e8e8e8;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 8.5px;
      color: #777;
    }

    .footer-left { line-height: 1.6; }
    .footer-center { text-align: center; line-height: 1.6; }
    .footer-right { line-height: 1.6; text-align: right; }

    /* ── Print / PDF ── */
    @media print {
      body { background: #fff; }
      .page {
        margin: 0;
        width: 100%;
        box-shadow: none;
        page-break-after: always;
      }
    }

    @page {
      size: A4;
      margin: 0;
    }
  </style>
</head>
<body>

<script>

  { data:'02/03/2026', hora:'21:15', tipo:'Pix recebido',  valor:  5.00, saldoDia: 388.18 },
  { data:'02/03/2026', hora:'21:14', tipo:'Pix recebido',  valor: 20.00, saldoDia: 388.18 },
  { data:'02/03/2026', hora:'21:14', tipo:'Pix recebido',  valor: 20.00, saldoDia: 388.18 },
];

// ── Helpers ──────────────────────────────────────────────────────────────────
const MESES = ['janeiro','fevereiro','março','abril','maio','junho',
               'julho','agosto','setembro','outubro','novembro','dezembro'];

function formatarData(ddmmaaaa) {
  const [d, m, a] = ddmmaaaa.split('/');
  return `${parseInt(d, 10)} de ${MESES[parseInt(m,10)-1]} ${a}`;
}

function formatarValor(v) {
  const abs = Math.abs(v).toFixed(2).replace('.', ',');
  return v >= 0 ? `+R$\u00a0${abs}` : `\u2212R$\u00a0${abs}`;
}

function brl(v) {
  return 'R$\u00a0' + v.toFixed(2).replace('.', ',');
}

// ── Group by date (order preserved) ─────────────────────────────────────────
const groups = [];
const seen   = {};
for (const row of rows) {
  if (!seen[row.data]) {
    seen[row.data] = { data: row.data, saldoDia: row.saldoDia, txs: [] };
    groups.push(seen[row.data]);
  }
  seen[row.data].txs.push(row);
}

// ── Render pages (max ~9 date-sections per A4 page) ─────────────────────────
// We distribute date-sections into pages by counting rows.
const ROWS_PER_PAGE = 25; // unidades por página (date-header=1, col-header=1, cada tx=1)

function buildPages(groups) {
  const pages = [];
  let current = [];
  let count   = 0;

  for (const g of groups) {
    const needed = 2 + g.txs.length; // header row + col header + rows
    if (current.length && count + needed > ROWS_PER_PAGE) {
      pages.push(current);
      current = [];
      count   = 0;
    }
    current.push(g);
    count += needed;
  }
  if (current.length) pages.push(current);
  return pages;
}

const pages = buildPages(groups);
const totalPages = pages.length;
const emitDate   = '14/04/2026 às 22:42';

// ── Build HTML ───────────────────────────────────────────────────────────────
function renderTableHeader() {
  return `
    <thead>
      <tr>
        <th class="col-hora">Hora</th>
        <th class="col-tipo">Tipo</th>
        <th class="col-origem">Origem / Destino</th>
        <th class="col-forma">Forma de pagamento</th>
        <th class="col-valor">Valor</th>
      </tr>
    </thead>`;
}

function renderRow(tx) {
  const isCredito = tx.valor >= 0;
  const valorHtml = `<span class="${isCredito ? 'valor-credito' : 'valor-debito'}">${formatarValor(tx.valor)}</span>`;
  const forma     = isCredito ? '' : 'Com saldo';
  return `
    <tr>
      <td class="col-hora">${tx.hora}</td>
      <td class="col-tipo">${tx.tipo}</td>
      <td class="col-origem"></td>
      <td class="col-forma">${forma}</td>
      <td class="col-valor">${valorHtml}</td>
    </tr>`;
}

function renderPage(groupsInPage, pageNum) {
  const isFirst = pageNum === 1;

  const topHeader = isFirst ? `
    <div class="top-header">
      <div class="account-info">
        <div class="name">William Ferreira Dos Santos</div>
        <div>CPF: 213.917.448-88&nbsp;&nbsp; Agência: 0001&nbsp;&nbsp; Conta: 14511032-0</div>
      </div>
    </div>

    <div class="extrato-title-block">
      <div class="extrato-label">Extrato de conta</div>
      <div class="period-row">
        <div>
          <div class="period-label">Período</div>
          <div class="period-value">1 a 30 de março de 2026</div>
        </div>
        <div>
          <div class="saldo-label">Saldo final do período</div>
          <div class="saldo-value">${brl(438.27)}</div>
        </div>
      </div>
    </div>` : `
    <div class="top-header">
      <div class="account-info">
        <div class="name">William Ferreira Dos Santos</div>
        <div>CPF: 213.917.448-88&nbsp;&nbsp; Agência: 0001&nbsp;&nbsp; Conta: 14511032-0</div>
      </div>
    </div>`;

  const sectionsHtml = groupsInPage.map(g => `
    <div class="date-section">
      <div class="date-header">
        <span class="date-text">${formatarData(g.data)}</span>
        <span class="saldo-text">Saldo ao final do dia: ${brl(g.saldoDia)}</span>
      </div>
      <table class="tx-table">
        ${renderTableHeader()}
        <tbody>
          ${g.txs.map(renderRow).join('')}
        </tbody>
      </table>
    </div>`).join('');

  const footer = `
    <div class="page-footer">
      <div class="footer-left">
        <div>Documento emitido em:</div>
        <div>${emitDate}</div>
      </div>
      <div class="footer-center">
        <div>PicPay Serviços S/A</div>
        <div>CNPJ: 22.896.431/0001-10</div>
      </div>
      <div class="footer-right">
        <div>0800 025 2000</div>
        <div>Dias úteis das 09h às 18h</div>
        <div style="margin-top:4px;font-size:9px;">${pageNum} de ${totalPages}</div>
      </div>
    </div>`;

  return `<div class="page">${topHeader}${sectionsHtml}${footer}</div>`;
}

document.write(pages.map((g, i) => renderPage(g, i + 1)).join(''));
</script>

</body>
</html>
